services:
  postgres:
    image: postgres:16-alpine
    container_name: webshop-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: webshop-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PORT: 5000
      DATA_DIR: /app/backend/data


      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      SECRET_KEY: ${SECRET_KEY}
      # argon2-хеш пароля: python security.py hash. ADMIN_PASSWORD открытым текстом оставлен только для совместимости
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # SEO: публичный адрес сайта (https://...) и коды подтверждения из Яндекс.Вебмастера и Google Search Console
      SITE_URL: ${SITE_URL:-}
      YANDEX_VERIFICATION: ${YANDEX_VERIFICATION:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      # номер счётчика Яндекс.Метрики (только цифры); пусто — счётчик не подключается
      YANDEX_METRIKA_ID: ${YANDEX_METRIKA_ID:-}

    ports:
      - "5000:5000"

    volumes:
      - ./backend/data:/app/backend/data

volumes:
  postgres_data: